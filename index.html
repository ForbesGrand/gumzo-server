<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gumzo</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#D32F2F">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{--red:#D32F2F;--dk:#B71C1C;--hink:#fff;--avbg:#B0605C;--bg:#F4F4F4;--panel:#fff;--ink:#1D1B1B;--mute:#707070;--line:#E3E3E3;--me:#FFE1DE;--meink:#1D1B1B;--them:#fff;--hover:#F8F0EF;--tick:#8E9A9E;--blue:#2196F3;--chatbg:var(--bg);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html[data-theme=blue]{--red:#1976D2;--dk:#0D47A1;--avbg:#5C7FB0;--me:#D6E8FA;--hover:#EEF4FB}
html[data-theme=yellow]{--red:#F9A825;--dk:#7A5200;--hink:#2B2100;--avbg:#B08C2E;--me:#FFEFB8;--hover:#FFF8E1}
html[data-theme=green]{--red:#2E7D32;--dk:#1B5E20;--avbg:#5C9B6A;--me:#D8EFD9;--hover:#EEF7EE}
html[data-bg=red]{--chatbg:#F9DEDC}html[data-bg=blue]{--chatbg:#DCEAF8}html[data-bg=yellow]{--chatbg:#FBF0C9}html[data-bg=green]{--chatbg:#DCEFDD}
@media (prefers-color-scheme:dark){
:root{--red:#C62828;--avbg:#8A4743;--bg:#121212;--panel:#1C1C1E;--ink:#EEEEEE;--mute:#9A9A9A;--line:#333;--me:#5C2321;--meink:#fff;--them:#2A2A2C;--hover:#262628;--tick:#B0B0B0;--blue:#4FC3F7}
html[data-theme=blue]{--red:#1565C0;--me:#1F3F66;--avbg:#46658F}
html[data-theme=yellow]{--red:#F9A825;--hink:#2B2100;--me:#5A4710;--avbg:#8A6B1C}
html[data-theme=green]{--red:#2E7D32;--me:#1E4A22;--avbg:#3E7A4A}
html[data-bg=red]{--chatbg:#2E1818}html[data-bg=blue]{--chatbg:#152331}html[data-bg=yellow]{--chatbg:#2E2813}html[data-bg=green]{--chatbg:#15281A}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
input,select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%}
input[type=checkbox]{width:auto}
.pri{background:var(--red);color:var(--hink);border-radius:10px;padding:10px 16px;font-weight:600}
.light{background:#fff;color:var(--dk);border-radius:16px;padding:6px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.lnk{text-decoration:underline;color:var(--mute);font-size:14px}
.note{color:var(--mute);font-size:13px;margin:0}
#err{color:var(--red);font-size:14px;margin:0;min-height:18px}
#join{max-width:360px;margin:0 auto;padding:9vh 20px;display:flex;flex-direction:column;gap:12px}
#join h1{margin:0;font-size:36px;color:var(--red)}
.pane{display:flex;flex-direction:column;gap:12px}
.app{display:grid;grid-template-columns:330px 1fr;height:100%;max-width:1100px;margin:0 auto;background:var(--panel)}
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.hdr{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--red);color:var(--hink)}
.hdr h2{margin:0;font-size:22px}.grow{flex:1;min-width:0}
.hdr small{display:block;color:inherit;opacity:.85;font-size:12px;min-height:14px}
.who{display:flex;gap:10px;align-items:center;text-align:left;color:inherit;min-width:0;flex:1}
.tools{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.row2{display:flex;gap:6px}.row2 input{flex:1;min-width:0}
.list{overflow:auto;flex:1}
.row{display:flex;gap:12px;align-items:center;width:100%;padding:0 0 0 12px;text-align:left}
.row:hover,.row.on{background:var(--hover)}
.rw{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:12px 12px 12px 0;border-bottom:1px solid var(--line)}
.rm{flex:1;min-width:0}.rm b{display:block}.rm small{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rm small.unr{color:var(--ink);font-weight:700}
.badge{background:var(--red);color:var(--hink);border-radius:10px;font-size:12px;font-weight:700;padding:1px 7px}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--avbg);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.hdr .av{width:38px;height:38px;background:rgba(255,255,255,.3);color:var(--hink)}
.av.big{width:96px;height:96px;font-size:40px;margin:0 auto}
.main{display:flex;flex-direction:column;min-height:0;background:var(--chatbg)}
.back{display:none;font-size:26px;color:var(--hink);padding:0 4px}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:min(80%,460px);padding:7px 10px 5px;border-radius:14px;background:var(--them);border:1px solid var(--line);align-self:flex-start;line-height:1.35;white-space:pre-wrap;word-break:break-word}
.m.me{align-self:flex-end;background:var(--me);color:var(--meink);border-color:transparent}
.m time{display:block;text-align:right;font-size:11px;color:var(--mute);margin-top:2px}
.tk{display:inline-block;vertical-align:-1px;color:var(--tick);fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;font-size:11px}
.tk.r{color:var(--blue)}
.pic{max-width:100%;max-height:300px;border-radius:10px;display:block;cursor:zoom-in;margin-bottom:4px}
.m video{max-width:100%;max-height:320px;border-radius:10px;display:block;margin-bottom:4px}
.fl{display:block;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.06);color:inherit;text-decoration:none;font-size:14px;text-align:left;margin-bottom:4px}
.shop{background:var(--panel);border-top:1px solid var(--line);padding:10px 14px;max-height:45%;overflow:auto}
.shop div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0}.shop input{width:70px}
.bar{display:flex;gap:8px;padding:10px;background:var(--panel);border-top:1px solid var(--line);align-items:center}
.bar input{flex:1;border-radius:22px}.bar .pri{border-radius:22px}.clip{font-size:22px;padding:0 4px}
.empty{margin:auto;color:var(--mute);text-align:center;padding:24px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:20;padding:12px}
.sheet{background:var(--panel);border-radius:16px;padding:18px;width:min(94vw,380px);max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.sheet label.note{display:flex;flex-direction:column;gap:4px}.sheet label.note.chk{flex-direction:row;align-items:center;gap:8px}
.act{display:block;width:100%;text-align:left;padding:13px 4px;border-bottom:1px solid var(--line);font-size:16px}
.act.dng{color:var(--red)}.dl{color:var(--mute);font-style:italic}.m{cursor:pointer}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border:2px solid var(--line);border-radius:18px;font-size:14px}
.chip.on{border-color:var(--red);font-weight:700}.chip i{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.2)}
.qt{border-left:3px solid var(--red);padding:2px 8px;margin-bottom:4px;font-size:13px;color:var(--mute);background:rgba(0,0,0,.05);border-radius:4px}
.rb{display:flex;gap:8px;padding:6px 12px;background:var(--panel);border-top:1px solid var(--line);font-size:13px;color:var(--mute)}.rb .grow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#emo{display:flex;flex-wrap:wrap;gap:2px;padding:6px 10px;background:var(--panel);border-top:1px solid var(--line)}#emo button{font-size:24px;padding:2px 5px}
.m audio{display:block;width:240px;max-width:100%;margin-bottom:4px}.m a{color:inherit;text-decoration:underline}
.sn{font-size:12px;font-weight:700;color:var(--red)}
.rx{margin-top:3px;font-size:13px}.rx span{background:rgba(0,0,0,.07);border-radius:10px;padding:1px 6px;margin-right:4px}
#sv{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;color:#fff}
#sv img{max-width:100vw;max-height:84vh;object-fit:contain}.svt{font-size:28px;font-weight:700;text-align:center;padding:24px;max-width:620px;white-space:pre-wrap;word-break:break-word}
.svf{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:13px;padding:0 16px}.svx{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;font-size:28px;color:#fff}
.lbl{display:inline-block;cursor:pointer;text-align:center}
.cen{display:flex;gap:10px;justify-content:center;align-items:center}
#lb{position:fixed;inset:0;background:#000;display:grid;place-items:center;z-index:30;cursor:zoom-out}
#lb img{max-width:100vw;max-height:100vh;object-fit:contain}
@media (max-width:700px){.app{grid-template-columns:1fr}.main{display:none}.app.open .side{display:none}.app.open .main{display:flex}.back{display:block}}
/* ---- Gumzo look: soft gradients, rounded cards, floating message bar ---- */
input,select{border-radius:14px}
.hdr{background:linear-gradient(125deg,var(--red),color-mix(in srgb,var(--red) 68%,#000));box-shadow:0 4px 16px rgba(0,0,0,.18);border-radius:0 0 22px 22px;padding:12px 14px 14px;position:relative;z-index:2}
html[data-theme=yellow] .hdr{background:linear-gradient(125deg,var(--red),color-mix(in srgb,var(--red) 75%,#fff))}
.hdr h2{font-weight:800;letter-spacing:-.5px;font-size:24px}
.light{background:rgba(255,255,255,.22);color:inherit;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:18px}
.row{margin:3px 8px;width:calc(100% - 16px);border-radius:18px;padding-left:8px}
.av{width:48px;height:48px;box-shadow:0 0 0 2px var(--panel),0 0 0 4px color-mix(in srgb,var(--red) 38%,transparent)}
.hdr .av{width:40px;height:40px;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.av.big{width:104px;height:104px;box-shadow:0 0 0 3px var(--panel),0 0 0 6px color-mix(in srgb,var(--red) 45%,transparent)}
.main{background-image:radial-gradient(color-mix(in srgb,var(--ink) 7%,transparent) 1.2px,transparent 1.2px);background-size:20px 20px}
.m{border:0;border-radius:20px 20px 20px 6px;box-shadow:0 1px 3px rgba(0,0,0,.1);padding:8px 12px 5px}
.m.me{border-radius:20px 20px 6px 20px;background:linear-gradient(135deg,var(--me),color-mix(in srgb,var(--me) 78%,var(--red) 22%))}
.bar{margin:8px 10px 10px;border-radius:30px;border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.12);padding:6px 8px}
.bar input{border:0;background:transparent}
.bar #send{border-radius:50%;width:42px;height:42px;padding:0;font-size:0;display:grid;place-items:center;background:linear-gradient(135deg,var(--red),color-mix(in srgb,var(--red) 70%,#000))}
.bar #send::before{content:"➤";font-size:18px}
.sheet{border-radius:26px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
#join{margin:6vh auto;padding:30px 24px;background:var(--panel);border-radius:28px;box-shadow:0 14px 44px rgba(0,0,0,.14)}
#join h1{font-size:44px;letter-spacing:-1.5px;background:linear-gradient(120deg,var(--red),color-mix(in srgb,var(--red) 60%,#000));-webkit-background-clip:text;background-clip:text;color:transparent}
.pri{box-shadow:0 3px 10px color-mix(in srgb,var(--red) 35%,transparent)}
.badge{padding:2px 8px;box-shadow:0 2px 6px color-mix(in srgb,var(--red) 40%,transparent)}
.pinbar{padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--line);font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mn{font-weight:700;color:#1E88E5}.mnl{display:flex;gap:6px;padding:6px 10px;background:var(--panel);border-top:1px solid var(--line);overflow:auto}.mnl button{padding:4px 10px;border:1px solid var(--line);border-radius:14px}
.stories{display:flex;gap:12px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line);scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.sc{flex:none;width:64px;text-align:center;font-size:11px;cursor:pointer}
.sc .rg{width:60px;height:60px;border-radius:50%;padding:3px;display:grid;place-items:center;background:conic-gradient(var(--red),#FF9800,var(--red));position:relative;margin:0 auto 3px}
.sc.seen .rg{background:var(--line)}
.sc .rg .av{width:100%;height:100%;box-shadow:0 0 0 2px var(--panel)}
.sc small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
.sc .pl{position:absolute;right:-3px;bottom:-3px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;line-height:18px;border:2px solid var(--panel);font-size:15px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:10px 4px;font-weight:600;color:var(--mute);border-bottom:3px solid transparent}
.tabs button.on{color:var(--red);border-color:var(--red)}
.tb{background:var(--red);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;margin-left:4px}
.svc{position:absolute;left:0;right:0;bottom:104px;padding:10px 16px;background:linear-gradient(transparent,rgba(0,0,0,.65));text-align:center;font-size:16px;word-break:break-word}
#sv video{width:100%;max-height:84vh;object-fit:contain}
</style>
</head>
<body>
<div id="join">
  <h1>Gumzo</h1>
  <p id="err"></p>

  <div class="pane" id="p_login">
    <input id="l_id" placeholder="Name, phone number or email" aria-label="Name, phone number or email" autocomplete="username" autocapitalize="none">
    <input id="l_pw" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password">
    <button class="pri" id="login">Log in</button>
    <button class="lnk" id="go_signup">Create account</button>
    <button class="lnk" id="go_forgot">Forgot password?</button>
  </div>

  <div class="pane" id="p_signup" hidden>
    <p class="note">Your name and phone number are how friends find you, and friends can see your number. We also use your phone to send a code if you forget your password.</p>
    <input id="s_name" placeholder="Your name (3 to 20 letters or numbers)" maxlength="20" aria-label="Your name" autocomplete="username" autocapitalize="none">
    <input id="s_phone" type="tel" placeholder="Phone number, e.g. 0712 345 678" aria-label="Phone number" autocomplete="tel">
    <input id="s_email" type="email" placeholder="Email (optional, also gets reset codes)" aria-label="Email" autocomplete="email" autocapitalize="none">
    <input id="s_pw" type="password" placeholder="Password (6 or more characters)" aria-label="Password" autocomplete="new-password">
    <button class="pri" id="signup">Create account</button>
    <button class="lnk" id="back_login1">Back to log in</button>
  </div>

  <div class="pane" id="p_forgot" hidden>
    <p class="note">Type your name, phone number or email. We will send a 6-digit code by SMS, and by email too if you saved one.</p>
    <input id="f_id" placeholder="Name, phone number or email" aria-label="Name, phone number or email" autocapitalize="none">
    <button class="pri" id="forgot">Send code</button>
    <button class="lnk" id="have_code">I already have a code</button>
    <button class="lnk" id="back_login2">Back to log in</button>
  </div>

  <div class="pane" id="p_reset" hidden>
    <input id="r_id" placeholder="Name, phone number or email" aria-label="Name, phone number or email" autocapitalize="none">
    <input id="r_code" inputmode="numeric" placeholder="6-digit code" aria-label="6-digit code" autocomplete="one-time-code">
    <input id="r_pw" type="password" placeholder="New password (6 or more characters)" aria-label="New password" autocomplete="new-password">
    <button class="pri" id="reset">Change password</button>
    <button class="lnk" id="back_login3">Back to log in</button>
  </div>
</div>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="hdr">
      <button class="who" id="meav" aria-label="My profile"></button>
      <h2 class="grow">Gumzo</h2>
      <button class="light" id="hmenu" aria-label="Menu">⋮</button>
          </div>
    <div class="stories" id="stories"></div>
    <div class="tools">
      <label class="note"><input type="checkbox" id="low"> Low-data mode (photos and videos load only when you tap)</label>
      <input id="srch" placeholder="Search chats" aria-label="Search chats" autocomplete="off">
      <div class="row2"><input id="nc" placeholder="Friend’s name or phone number" aria-label="Friend’s name or phone number" autocomplete="off" autocapitalize="none"><button class="pri" id="start">Chat</button></div>
      <p class="note" id="status"></p>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="list" id="list"></div>
  </aside>
  <section class="main" id="main"></section>
</div>

<div id="modal" hidden></div>
<div id="lb" hidden></div>
<div id="sv" hidden></div>
<input type="file" id="file" hidden>

<script>
var ws,me="",low=false,cur=null,lastTyping=0,catalog=[],chats={shop:{m:[],un:0}},prof={},cidN=0,token="",rid="";
var MAXF=8*1024*1024,RANK={pending:0,sent:1,delivered:2,read:3};
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function now(){var d=new Date();return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
function hm(s){var d=new Date(s);return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
function chat(n){if(!chats[n])chats[n]={m:[],un:0};return chats[n]}
function isG(n){return n.indexOf("g:")===0}
function label(n){return n==="shop"?"Family Shop (shop)":isG(n)&&groups[n]?groups[n].name:n}
function status(t){$("status").textContent=t}
function say(t){$("err").textContent=t}
function tx(o){if(ws&&ws.readyState===1){ws.send(JSON.stringify(o));return true}return false}
function hdrs(x){var h={Authorization:"Bearer "+token};for(var k in x)h[k]=x[k];return h}
function api(path,opt){opt=opt||{};opt.headers=hdrs(opt.headers);return fetch(path,opt).then(function(r){return r.json()})}
function post(path,obj){return api(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(obj)})}
function pj(path,obj){return fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(obj)}).then(function(r){return r.json()})}
function fileUrl(id){return "/api/file/"+id+"?token="+token}
function size(n){return n<1024?n+" B":n<1048576?Math.round(n/1024)+" KB":(n/1048576).toFixed(1)+" MB"}
try{token=localStorage.getItem("gz")||""}catch(e){}
var svList=[],svI=0,stBg="#D32F2F",dis={},onceNext=false,starred={},groups={},prefs={},blocked={},showArch=false,replyTo=null,rec=null,chunks=[],EMO=Array.from("😀😂🤣😍🥰😘😊😉😎🤔😢😭😡😴😅😇🙏👍👎👏🙌💪🤝👋👀🔥💖💔🎉✨💯✅❌🎁🙂😋😜🤗😱😬");
var LOOK={theme:"red",bg:"default"},TC={red:"#D32F2F",blue:"#1976D2",yellow:"#F9A825",green:"#2E7D32"},pres={},typingUntil=0;
function applyLook(t,b){
  if(!TC[t])t="red";if(!/^(default|red|blue|yellow|green)$/.test(b))b="default";
  LOOK={theme:t,bg:b};var r=document.documentElement;r.dataset.theme=t;r.dataset.bg=b;
  var mt=document.querySelector('meta[name=theme-color]');if(mt)mt.content=TC[t];
  try{localStorage.setItem("gzl",JSON.stringify(LOOK))}catch(e){}
}
try{var sl=JSON.parse(localStorage.getItem("gzl")||"null");if(sl)applyLook(sl.theme,sl.bg)}catch(e){}
function setLook(k,v){
  var t=LOOK.theme,b=LOOK.bg;if(k==="theme")t=v;else b=v;
  applyLook(t,b);
  document.querySelectorAll("button[data-theme],button[data-bg]").forEach(function(x){x.classList.toggle("on",(x.dataset.theme&&x.dataset.theme===LOOK.theme)||(x.dataset.bg&&x.dataset.bg===LOOK.bg))});
  post("/api/settings",{theme:LOOK.theme,bg:LOOK.bg}).catch(function(){});
}
function chips(k){
  var o=k==="theme"?[["red","Red"],["blue","Blue"],["yellow","Yellow"],["green","Green"]]:[["default","Default"],["red","Red"],["blue","Blue"],["yellow","Yellow"],["green","Green"]];
  var cs={red:"#D32F2F",blue:"#1976D2",yellow:"#F9A825",green:"#2E7D32","default":"#BDBDBD"};
  return o.map(function(x){return '<button class="chip'+(LOOK[k]===x[0]?' on':'')+'" data-'+k+'="'+x[0]+'"><i style="background:'+cs[x[0]]+'"></i>'+x[1]+'</button>'}).join("");

function presText(p){

  ws.onmessage=function(e){handle(JSON.parse(e.data))};

function shrink(f,max,qlt,sq){
  return new Promise(function(ok,no){
    var u=URL.createObjectURL(f),im=new Image();
    im.onload=function(){
      URL.revokeObjectURL(u);
      var w=im.width,h=im.height,sx=0,sy=0,sw=w,sh=h,cw,ch;
      if(sq){var s=Math.min(w,h);sx=(w-s)/2;sy=(h-s)/2;sw=sh=s;cw=ch=max}
      else{var k=Math.min(1,max/Math.max(w,h));cw=Math.round(w*k);ch=Math.round(h*k)}
      var c=document.createElement("canvas");c.width=cw;c.height=ch;
      var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,cw,ch);x.drawImage(im,sx,sy,sw,sh,0,0,cw,ch);
      c.toBlob(function(b){b?ok(b):no()},"image/jpeg",qlt);
    };
    im.onerror=function(){URL.revokeObjectURL(u);no()};
    im.src=u;
  });
}
function prep(f){
  var plain={blob:f,name:f.name||"file",mime:f.type||"application/octet-stream"};
  if(/^image\/(jpeg|png|webp)$/.test(f.type)){
    return shrink(f,1280,.8,false).then(function(b){return{blob:b,name:(f.name||"photo").replace(/\.\w+$/,"")+".jpg",mime:"image/jpeg"}}).catch(function(){return plain});
  }
  return Promise.resolve(plain);
}
function sendFile(f){
  if(!f||!cur)return;
  var to=cur,once=onceNext&&!isG(to);onceNext=false;
  if(!ws||ws.readyState!==1){status("Not connected yet. Try again in a moment.");return}
  status("Preparing…");
  prep(f).then(function(b){
    if(b.blob.size>MAXF){status("That file is too big. The limit is 8 MB.");return}
    var m={cid:++cidN,me:1,t:"",time:now(),st:"pending",kind:"file",up:1,file:{name:b.name,mime:b.mime,size:b.blob.size,once:once}};
    chat(to).m.push(m);renderMsgs();renderList();status("Sending…");
    fetch("/api/upload",{method:"POST",headers:hdrs({"Content-Type":b.mime,"X-Filename":encodeURIComponent(b.name),"X-To":to,"X-Once":once?"1":"0"}),body:b.blob})
    .then(function(r){return r.json()}).then(function(d){
      if(d.error){chats[to].m=chats[to].m.filter(function(x){return x!==m});status(d.error)}
      else{m.up=0;m.id=d.id;m.st=d.st;m.time=hm(d.at);m.file=d.file;status("Sent")}
      if(cur===to)renderMsgs();renderList();
    }).catch(function(){chats[to].m=chats[to].m.filter(function(x){return x!==m});status("Could not send the file. Check your internet.");if(cur===to)renderMsgs();renderList()});
  });
}

  var rem=300-(x.age||0)-(Date.now()-(x._t||Date.now()))/1000;
  var pen=x.owner===me&&media&&rem>0?'<button class="svx" id="svpen" aria-label="Edit caption" style="right:64px">✏️</button>':'';
  var foot;
  if(x.owner===me){var rx=(x.rx||[]).map(function(r){return r.e+" "+esc(r.n)}).join(" · ");
    foot='<div class="svf">👁 '+(x.views||[]).length+((x.views||[]).length?' · '+esc(x.views.join(", ")):'')+(rx?'<br>'+rx:'')+' <button class="lnk" data-sdel="'+x.id+'" style="color:#fff">Delete</button></div>'}
  else foot='<div class="svf">'+esc(label(x.owner))+' · '+hm(x.at)+'<div style="margin-top:6px">'+["👍","❤️","😂","😮","😢","🙏"].map(function(e){return '<button data-srx="'+e+'" style="font-size:24px;padding:2px 6px;border-radius:8px;'+(x.mine===e?'background:rgba(255,255,255,.3)':'')+'">'+e+'</button>'}).join("")+'</div></div>';
  $("sv").style.background=x.kind==="text"?x.bg:"#000";$("sv").innerHTML=body+cap+foot+pen+'<button class="svx" id="svx" aria-label="Close">✕</button>';$("sv").hidden=false;
  if(pen)window._pen=setTimeout(function(){var p=$("svpen");if(p)p.remove()},rem*1000+50);
  if(x.owner!==me&&!x.seen){x.seen=true;renderStories();post("/api/status/view",{id:x.id}).catch(function(){})}
}
function openCard(n){

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  if(e.target.closest("#sv")&&!e.target.closest("button")){svI++;showSv();return}

  if(t.dataset.sdel){post("/api/status/delete",{id:+t.dataset.sdel}).then(function(){$("sv").hidden=true;loadStories()});return}
  if(t.dataset.theme)return setLook("theme",t.dataset.theme);
  if(t.dataset.bg)return setLook("bg",t.dataset.bg);
  var sm=chats[cur]&&chats[cur].m[selMsg];
  if(t.dataset.react){if(sm){var em=t.dataset.react;tx({type:"react",id:sm.id,emoji:sm.rx&&sm.rx[me]===em?"":em})}closeModal();return}
  if(t.dataset.dis!=null){tx({type:"disappear",with:cur,secs:+t.dataset.dis});closeModal();return}
  if(t.dataset.once){
    var om=chats[cur].m[+t.dataset.once];
    if(om&&om.file)fetch(fileUrl(om.file.id)).then(function(r){if(!r.ok)throw 0;return r.blob()}).then(function(b){$("lb").innerHTML='<img src="'+URL.createObjectURL(b)+'" alt="">';$("lb").hidden=false;om.file.viewed=true;renderMsgs()}).catch(function(){om.file.viewed=true;renderMsgs();status("That photo was already opened")});
    return;
  }
  if(t.dataset.fwd){if(sm){tx({type:"forward",id:sm.id,to:t.dataset.fwd});status("Forwarding…")}closeModal();return}
  switch(t.id){
    case"act_me":if(sm){tx({type:"delete",id:sm.id,scope:"me"});chats[cur].m.splice(selMsg,1)}closeModal();renderList();renderMsgs();return;
    case"act_pin":if(sm){tx({type:"pin",id:sm.id,on:!sm.pn})}closeModal();return;
    case"act_star":if(sm){starred[sm.id]=!starred[sm.id];tx({type:"star",id:sm.id,on:!!starred[sm.id]});renderMsgs()}closeModal();return;
    case"act_fwd":modal('<div class="sheet"><strong>Forward to…</strong>'+Object.keys(chats).map(function(n){return '<button class="act" data-fwd="'+esc(n)+'">'+esc(label(n))+'</button>'}).join("")+'<button class="lnk" id="p_close">Cancel</button></div>');return;
    case"starl":
      var sh='<div class="sheet"><strong>Starred messages</strong>',cnt=0;
      Object.keys(chats).forEach(function(n){chats[n].m.forEach(function(m){if(m.id&&starred[m.id]&&!m.del){cnt++;sh+='<button class="act" data-id="'+esc(n)+'"><b>'+esc(label(n))+'</b><br><small class="note">'+esc(preview(m))+'</small></button>'}})});
      modal(sh+(cnt?'':'<p class="note">No starred messages yet. Tap a message and choose Star.</p>')+'<button class="lnk" id="p_close">Close</button></div>');return;
    case"act_reply":if(sm){replyTo={id:sm.id,txt:(sm.me?"You":label(cur))+": "+preview(sm)};showReply();if($("in"))$("in").focus()}closeModal();return;
    case"rb_x":replyTo=null;showReply();return;
    case"mic":return mic();
    case"arch_t":showArch=!showArch;renderList();return;
    case"pref_p":case"pref_a":case"pref_m":case"pref_u":
      var k=t.id.slice(5),o=prefs[cur]=prefs[cur]||{};o[k]=!o[k];tx({type:"pref",with:cur,key:k,on:!!o[k]});closeModal();
      if(k==="a"||k==="u"){cur=null;$("app").classList.remove("open");renderMain()}renderList();return;
    case"rpt":{var why=prompt("Why are you reporting this? (spam, abuse, scam, other)");if(why&&why.trim()){tx({type:"report",who:cur,reason:why.trim()});status("Report sent. Thank you.")}closeModal();return}
    case"blk":blocked[cur]=!blocked[cur];tx({type:"block",with:cur,on:!!blocked[cur]});closeModal();status(blocked[cur]?"Blocked "+cur:"Unblocked "+cur);return;
    case"del_acc":modal('<div class="sheet"><strong style="font-size:18px">Delete your account?</strong><p class="note">Your messages, photos and profile will be deleted for good. This cannot be undone.</p><p class="note"><b>Why are you leaving?</b> (optional)</p><label class="act"><input type="radio" name="dr" value="Using another app"> I use another app</label><label class="act"><input type="radio" name="dr" value="Privacy worries"> I am worried about my privacy</label><label class="act"><input type="radio" name="dr" value="Do not use it enough"> I do not use it enough</label><input id="del_pw" type="password" placeholder="Type your password to confirm" autocomplete="current-password"><p class="note" id="del_msg"></p><button class="pri" id="del_go" style="background:#C62828;color:#fff">Delete my account forever</button><button class="lnk" id="p_close">Cancel</button></div>');return;
    case"del_go":{var dpw=$("del_pw").value;if(!dpw){$("del_msg").textContent="Type your password first";return}var dr=document.querySelector("input[name=dr]:checked");post("/api/delete-account",{password:dpw,reason:dr?dr.value:""}).then(function(d){if(d.error){$("del_msg").textContent=d.error;return}try{localStorage.removeItem("gz")}catch(e){}location.reload()});return}
    case"emob":$("emo").hidden=!$("emo").hidden;return;
    case"loc_send":closeModal();return sendLoc();
    case"exp_chat":closeModal();return exportChat();
    case"act_all":if(sm)tx({type:"delete",id:sm.id,scope:"all"});closeModal();return;
    case"act_edit":
      if(!sm)return;
      modal('<div class="sheet"><strong>Edit message</strong><input id="ed_in" maxlength="2000" autocomplete="off"><button class="pri" id="ed_save">Save</button><button class="lnk" id="p_close">Cancel</button></div>');
      $("ed_in").value=sm.t;$("ed_in").focus();return;
    case"ed_save":
      var nt=$("ed_in").value.trim();
      if(sm&&nt&&nt!==sm.t)tx({type:"edit",id:sm.id,text:nt});
      closeModal();return;
    case"chatmenu":
      modal('<div class="sheet"><strong>'+esc(label(cur))+'</strong><button class="act" id="pref_p">📌 '+(prefs[cur]&&prefs[cur].p?"Unpin":"Pin")+' chat</button><button class="act" id="pref_a">🗄️ '+(prefs[cur]&&prefs[cur].a?"Unarchive":"Archive")+' chat</button><button class="act" id="pref_m">🔇 '+(prefs[cur]&&prefs[cur].m?"Unmute":"Mute")+' chat</button>'+(isG(cur)?'<button class="act" id="g_info">👥 Group info and members</button>':'')+(cur==="shop"||isG(cur)?'':'<button class="act dng" id="blk">🚫 '+(blocked[cur]?"Unblock ":"Block ")+esc(cur)+'</button>')+(cur==="shop"?'':'<button class="act dng" id="rpt">🚩 Report '+esc(isG(cur)?"this group":cur)+'</button>')+'<button class="act" id="dis_m">⏳ Disappearing messages: '+({0:"Off",86400:"24 hours",604800:"7 days",7776000:"90 days"}[dis[cur]||0])+'</button>'+(isG(cur)?'':'<button class="act" id="once_m">👁 Send a view-once photo</button>')+'<button class="act" id="pref_u">'+(prefs[cur]&&prefs[cur].u?"✔️ Clear unread mark":"🔵 Mark as unread")+'</button><button class="act" id="loc_send">📍 Send my location</button><button class="act" id="exp_chat">⬇️ Export this chat (text file)</button><button class="act dng" id="del_chat">Delete this chat for me only</button><p class="note">The other person keeps their copy. Messages you delete here stay on their phone.</p><button class="lnk" id="p_close">Cancel</button></div>');return;
    case"del_chat":
      tx({type:"clear",with:cur});
      if(cur==="shop")chats.shop.m=[];else delete chats[cur];
      cur=null;closeModal();$("app").classList.remove("open");renderList();renderMain();return;
    case"login":return doLogin();
    case"signup":return doSignup();
    case"go_signup":return pane("signup");
    case"go_forgot":return pane("forgot");
    case"have_code":return pane("reset");
    case"back_login1":case"back_login2":case"back_login3":return pane("login");
    case"forgot":return doForgot();
    case"reset":return doReset();
    case"logout":modal('<div class="sheet"><strong style="font-size:18px">Log out?</strong><p class="note">You will need your name and password to log in again.</p><button class="pri" id="do_logout">Log out</button><button class="lnk" id="p_close">Cancel</button></div>');return;
    case"do_logout":unpush().then(function(){return fetch("/api/logout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:token})})}).then(function(){try{localStorage.removeItem("gz")}catch(e){}location.reload()});return;
    case"push_on":return enablePush();
    case"statb":return openStatus();
    case"st_text":stBg="#D32F2F";modal('<div class="sheet"><strong>Text status</strong><textarea id="st_in" maxlength="300" rows="4" placeholder="What is on your mind?" style="width:100%;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit"></textarea><div class="sws">'+["#D32F2F","#1976D2","#2E7D32","#F57F17","#6A1B9A"].map(function(c){return '<button class="chip" data-sbg="'+c+'"><i style="background:'+c+'"></i></button>'}).join("")+'</div><button class="pri" id="st_post">Post for 24 hours</button><button class="lnk" id="p_close">Cancel</button></div>');return;
    case"st_post":var stx=$("st_in").value.trim();if(!stx)return;post("/api/status",{text:stx,bg:stBg}).then(function(d){if(d.error){status(d.error);return}openStatus()});return;
    case"svx":$("sv").hidden=true;return;
    case"profbtn":case"meav":return openProfile();
    case"p_close":return closeModal();
    case"p_save":return saveProfile();

    case"who":return isG(cur)?openGroup():openCard(cur);

    case"g_leave":if(confirm("Leave this group?")){tx({type:"gleave",id:cur});closeModal()}return;

      var n=$("nc").value.trim();if(!n)return;

        if(d.found&&d.name!==me){prof[d.name]={av:d.av,phone:d.phone,about:d.about};$("nc").value="";openChat(d.name)}

  if(e.key!=="Enter")return;

setInterval(function(){

},20000);
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js");
if(token){say("Signing in…");connect()}
