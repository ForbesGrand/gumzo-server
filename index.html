<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gumzo</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0E5C73">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{--bg:#EEF3F5;--panel:#fff;--ink:#12262E;--mute:#6B7F88;--line:#DCE5E9;--me:#0E5C73;--meink:#fff;--them:#fff;--acc:#F4B63F;--accink:#3A2A00;--hover:#F2F7F9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0B1418;--panel:#122229;--ink:#E6F0F3;--mute:#8CA3AD;--line:#21383F;--me:#13839F;--them:#1A2F37;--hover:#183039}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.pri{background:var(--me);color:var(--meink);border-radius:10px;padding:10px 16px;font-weight:600}
#join{max-width:360px;margin:0 auto;padding:12vh 20px;display:flex;flex-direction:column;gap:12px}
#join h1{margin:0;font-size:34px}#err,.note{color:var(--mute);font-size:13px;margin:0}
.app{display:grid;grid-template-columns:320px 1fr;height:100%;max-width:1100px;margin:0 auto;background:var(--panel)}
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:12px;gap:10px}
.side h2{margin:0;font-size:22px}.row2{display:flex;gap:6px}.row2 input{flex:1;min-width:0}
.list{overflow:auto;flex:1;margin:0 -12px}
.row{display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;text-align:left}
.row:hover,.row.on{background:var(--hover)}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--me)}
.rm{flex:1;min-width:0}.rm b{display:block}.rm small{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rm small.unr{color:var(--ink);font-weight:700}.badge{background:var(--acc);color:var(--accink);border-radius:10px;font-size:12px;font-weight:700;padding:1px 7px}
.main{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.top{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.top .grow{flex:1}.top small{display:block;color:var(--mute)}.back{display:none;font-size:22px}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:min(80%,460px);padding:8px 12px;border-radius:16px;background:var(--them);border:1px solid var(--line);align-self:flex-start;line-height:1.35;white-space:pre-wrap}
.m.me{align-self:flex-end;background:var(--me);color:var(--meink);border-color:transparent}
.m time{display:block;font-size:11px;opacity:.65}.tr{margin-top:4px;padding-top:4px;border-top:1px dashed var(--line);font-size:14px}
.m .t{font-size:12px;text-decoration:underline;opacity:.75;padding:2px 0}
.shop{background:var(--panel);border-top:1px solid var(--line);padding:10px 14px;max-height:45%;overflow:auto}
.shop div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0}.shop input{width:70px}
.bar{display:flex;gap:8px;padding:10px;background:var(--panel);border-top:1px solid var(--line)}
.bar input{flex:1;border-radius:22px}.bar .pri{border-radius:22px}
.empty{margin:auto;color:var(--mute);text-align:center;padding:24px}
@media (max-width:700px){.app{grid-template-columns:1fr}.main{display:none}.app.open .side{display:none}.app.open .main{display:flex}.back{display:block}}
</style>
</head>
<body>
<div id="join">
  <h1>Gumzo</h1>
  <p class="note">Log in, or create an account. Your name is how friends find you.</p>
  <input id="nm" placeholder="Your name" maxlength="20" aria-label="Your name" autocomplete="username" autocapitalize="none">
  <input id="pw" type="password" placeholder="Password (6 or more characters)" aria-label="Password" autocomplete="current-password">
  <button class="pri" id="login">Log in</button>
  <button id="signup" style="text-decoration:underline">Create account</button>
  <p id="err"></p>
</div>
<div class="app" id="app" hidden>
  <aside class="side">
    <h2>Gumzo</h2><button class="note" id="logout" style="text-align:left;text-decoration:underline">Log out</button>
    <label class="note"><input type="checkbox" id="low"> Low-data mode (fewer signals, less data)</label>
    <div class="row2"><input id="nc" placeholder="Friend’s name" aria-label="Friend’s name" autocomplete="off"><button class="pri" id="start">Chat</button></div>
    <p class="note" id="status"></p>
    <div class="list" id="list"></div>
  </aside>
  <section class="main" id="main"></section>
</div>
<script>
var ws,me="",low=false,cur=null,tl="en",lastTyping=0,catalog=[],chats={shop:{m:[],un:0}};
var $=function(i){return document.getElementById(i)};
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function now(){var d=new Date();return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
function chat(n){if(!chats[n])chats[n]={m:[],un:0};return chats[n]}
function label(n){return n==="shop"?"Kariakoo Electronics (shop)":n}
function status(t){$("status").textContent=t}
function tx(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}

var token="";try{token=localStorage.getItem("gz")||""}catch(e){}
function hm(s){var d=new Date(s);return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
function auth(kind){
  var n=$("nm").value.trim(),p=$("pw").value;
  if(!n||!p){$("err").textContent="Type your name and password";return}
  $("err").textContent="Please wait…";
  fetch("/api/"+(kind==="login"?"login":"register"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n,password:p})})
  .then(function(r){return r.json()}).then(function(d){
    if(d.error){$("err").textContent=d.error;return}
    token=d.token;try{localStorage.setItem("gz",token)}catch(e){}
    connect();
  }).catch(function(){$("err").textContent="Could not reach the server. Try again."});
}
function connect(){
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
  ws.onopen=function(){tx({type:"join",token:token,lowData:low})};
  ws.onmessage=function(e){var d=JSON.parse(e.data);handle({type:d.type||d.t,from:d.from||d.f,text:d.text||d.x,products:d.products,name:d.name,msgs:d.msgs})};
  ws.onclose=function(){if(!$("app").hidden){status("Connection lost. Reconnecting…");setTimeout(connect,2000)}};
}
function handle(d){
  if(d.type==="auth"){token="";try{localStorage.removeItem("gz")}catch(e){}$("app").hidden=true;$("join").hidden=false;$("err").textContent="Please log in again";return}
  if(d.type==="history"){chats={shop:{m:[],un:0}};d.msgs.forEach(function(x){var o=x.from===me?x.to:x.from;chat(o).m.push({me:x.from===me?1:0,t:x.text,time:hm(x.at)})});renderList();renderMain();return}
  if(d.type==="joined"){me=d.name;$("join").hidden=true;$("app").hidden=false;status("Connected as "+me);renderList();renderMain();return}
  if(d.type==="error"){if($("app").hidden)$("err").textContent=d.text;else status(d.text);return}
  if(d.type==="catalog"){catalog=d.products;renderShop();return}
  if(d.type==="typing"){if(d.from===cur&&$("st")){$("st").textContent="typing…";setTimeout(function(){if($("st"))$("st").textContent=""},2000)}return}
  if(d.type==="msg"||d.type==="order"){
    var c=chat(d.from);c.m.push({me:0,t:d.text,time:now()});
    if(cur!==d.from)c.un++;
    renderList();if(cur===d.from)renderMsgs();
  }
}
function renderList(){
  var h="";Object.keys(chats).sort(function(a,b){return a==="shop"?-1:b==="shop"?1:0}).forEach(function(n){
    var lm=chats[n].m[chats[n].m.length-1];
    h+='<button class="row'+(cur===n?' on':'')+'" data-id="'+esc(n)+'"><span class="av">'+esc(n[0].toUpperCase())+'</span><span class="rm"><b>'+esc(label(n))+'</b><small class="'+(chats[n].un?'unr':'')+'">'+(lm?esc(lm.t):'No messages yet')+'</small></span>'+(chats[n].un?'<span class="badge">'+chats[n].un+'</span>':'')+'</button>';
  });
  $("list").innerHTML=h;
}
function renderMain(){
  if(!cur){$("main").innerHTML='<div class="empty">Pick a chat, or type a friend’s name and tap Chat.</div>';return}
  $("main").innerHTML='<div class="top"><button class="back" id="back" aria-label="Back to chats">‹</button><div class="grow"><strong>'+esc(label(cur))+'</strong><small id="st"></small></div>'+
  (cur==="shop"?'<button class="pri" id="browse">Browse products</button>':'')+
  '<select id="tl" aria-label="Translate messages to"><option value="en">Translate to English</option><option value="sw">Translate to Swahili</option></select></div>'+
  '<div class="msgs" id="msgs"></div><div class="shop" id="shop" hidden></div>'+
  '<div class="bar"><input id="in" placeholder="Write a message" aria-label="Write a message" autocomplete="off"><button class="pri" id="send">Send</button></div>';
  $("tl").value=tl;renderMsgs();
}
function renderMsgs(){
  var h="";chats[cur].m.forEach(function(m,i){
    h+='<div class="m'+(m.me?' me':'')+'">'+esc(m.t)+'<time>'+m.time+'</time>'+(m.tr?'<div class="tr">'+esc(m.tr)+'</div>':'')+(m.me?'':'<button class="t" data-tr="'+i+'">Translate</button>')+'</div>';
  });
  var el=$("msgs");el.innerHTML=h||'<div class="empty">No messages yet. Say hi 👋</div>';el.scrollTop=el.scrollHeight;
}
function renderShop(){
  var h='<strong>Products</strong>';catalog.forEach(function(p){
    h+='<div><span>'+esc(p.name)+'<br><small>TSh '+p.price.toLocaleString("en-US")+' · '+p.stock+' in stock</small></span><input type="number" min="0" max="'+p.stock+'" value="0" data-p="'+p.id+'" aria-label="Quantity of '+esc(p.name)+'"></div>';
  });
  h+='<button class="pri" id="order">Place order</button>';
  if($("shop")){$("shop").innerHTML=h;$("shop").hidden=false}
}
function openChat(n){cur=n;chat(n).un=0;$("app").classList.add("open");renderList();renderMain()}
function send(){
  var i=$("in"),v=i.value.trim();if(!v)return;
  chat(cur).m.push({me:1,t:v,time:now()});tx({type:"msg",to:cur,text:v});
  i.value="";renderMsgs();i.focus();
}
function translate(i){
  var m=chats[cur].m[i],from=tl==="en"?"sw":"en";m.tr="Translating…";renderMsgs();
  fetch("/api/translate?text="+encodeURIComponent(m.t)+"&from="+from+"&to="+tl).then(function(r){return r.json()})
  .then(function(d){m.tr=d.text||d.error;renderMsgs()}).catch(function(){m.tr="Could not translate. Check your internet.";renderMsgs()});
}
document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.id==="login"||t.id==="signup")return auth(t.id==="login"?"login":"register");
  if(t.id==="logout"){fetch("/api/logout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:token})}).then(function(){try{localStorage.removeItem("gz")}catch(e){}location.reload()});return}
  if(t.id==="start"){var n=$("nc").value.trim().toLowerCase();if(n&&n!==me){$("nc").value="";openChat(n)}return}
  if(t.dataset.id)return openChat(t.dataset.id);
  if(t.id==="back"){$("app").classList.remove("open");return}
  if(t.id==="send")return send();
  if(t.id==="browse"){tx({type:"catalog"});return}
  if(t.dataset.tr)return translate(+t.dataset.tr);
  if(t.id==="order"){
    var items=[];document.querySelectorAll("[data-p]").forEach(function(i){var q=parseInt(i.value)||0;if(q>0)items.push({id:+i.dataset.p,qty:q})});
    if(!items.length){status("Choose a quantity first");return}
    tx({type:"order",items:items});$("shop").hidden=true;
  }
});
document.addEventListener("change",function(e){
  if(e.target.id==="low"){low=e.target.checked;tx({type:"lowdata",on:low});status(low?"Low-data mode on":"Low-data mode off")}
  if(e.target.id==="tl")tl=e.target.value;
});
document.addEventListener("input",function(e){
  if(e.target.id==="in"&&!low&&Date.now()-lastTyping>1500&&cur){lastTyping=Date.now();tx({type:"typing",to:cur})}
});
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;
  if(e.target.id==="in")send();
  if(e.target.id==="pw")$("login").click();
  if(e.target.id==="nc")$("start").click();
});
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js");
if(token){$("err").textContent="Signing in…";connect()}
</script>
</body>
</html>
